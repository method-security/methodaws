# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: methodaws

builds:
  - id: build-linux-amd64
    main: .
    binary: methodaws
    ldflags:
      - -s -w
      - "-extldflags '-static -lm -ldl -lpthread'"
      - -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goarm:
      - "7"
  - id: build-linux-arm64
    main: .
    binary: methodaws
    ldflags:
      - -s -w
      - "-extldflags '-static -lm -ldl -lpthread'"
      - -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    goarm:
      - "7"
  - id: build-macos
    main: .
    binary: methodaws
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    goarm:
      - "7"
  - id: build-windows
    main: .
    binary: methodaws
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
