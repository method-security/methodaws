# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  common: ../common/resources.yml

types:
# Config
  VpcEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  VpcState:
    enum:
      - PENDING
      - AVAILABLE
  Tenancy:
    enum:
      - DEFAULT
      - DEDICATED
      - HOST
  SubnetState:
    enum:
      - PENDING
      - AVAILABLE
      - UNAVAILABLE
  SubnetHostnameType:
    enum:
      - IP_NAME
      - RESOURCE_NAME
# Supporting Types
  AvailabilityZone:
    properties:
      zoneId: optional<string>
      zoneName: optional<string>
      networkBorderGroup: optional<string>
      parentZoneId: optional<string>
      parentZoneName: optional<string>
      groupName: optional<string>
      state: optional<string>
      optInStatus: optional<string>
  VpcCidrBlockAssociation:
    properties:
      associationId: string
      cidrBlock: string
  PrivateDnsNameOptionsOnLaunch:
    properties:
      hostnameType: optional<SubnetHostnameType>
      enableResourceNameDnsARecord: optional<boolean>
      enableResourceNameDnsAaaaRecord: optional<boolean>
# Subnet High level structs
  SubnetIdentificationInfo:
    properties:
      id: string
      arn: optional<string>
      name: optional<string>
      region: string
  SubnetConfigurationInfo:
    properties:
      assignIpv6AddressOnCreation: optional<boolean>
      availabilityZone: optional<AvailabilityZone>
      availableIpAddressCount: optional<integer>
      customerOwnedIpv4Pool: optional<string>
      defaultForAz: optional<boolean>
      enableDns64: optional<boolean>
      enableLniAtDeviceIndex: optional<integer>
      ipv6Native: optional<boolean>
      mapCustomerOwnedIpOnLaunch: optional<boolean>
      mapPublicIpOnLaunch: optional<boolean>
      outpostArn: optional<string>
      ownerId: optional<string>
      privateDnsNameOptionsOnLaunch: optional<PrivateDnsNameOptionsOnLaunch>
      state: optional<SubnetState>
      tags: optional<list<common.Tag>>
  SubnetResourceInfo:
    properties:
      cidrBlock: optional<string>
      cidrBlockAssociationSet: optional<list<VpcCidrBlockAssociation>>
#  Subnet Main Struct
  Subnet:
    properties:
      identification: SubnetIdentificationInfo
      configuration: SubnetConfigurationInfo
      resources: optional<SubnetResourceInfo>
# VPC High level structs
  VpcIdentificationInfo:
    properties:
      id: string
      region: string
      name: optional<string>
  VpcConfigurationInfo:
    properties:
      creationCidrBlock: optional<string>
      dhcpOptionsId: optional<string>
      instanceTenancy: optional<Tenancy>
      isDefault: optional<boolean>
      ownerId: optional<string>
      state: optional<VpcState>
      tags: optional<list<common.Tag>>
  VpcResourceInfo:
    properties:
      subnets: optional<list<Subnet>>
      cidrBlockAssociationSet: optional<list<VpcCidrBlockAssociation>>
# Main VPC structs
  VpcInstance:
    properties:
      identification: VpcIdentificationInfo
      configuration: VpcConfigurationInfo
      resources: optional<VpcResourceInfo>
  VpcEnumerateResult:
    properties:
      vpcs: optional<list<VpcInstance>>
# Report Struct
  VpcEnumerateReport:
    properties:
      result: VpcEnumerateResult
      config: VpcEnumerateConfig
      errors: optional<list<string>>
