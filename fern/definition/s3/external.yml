imports:
  enumerate: ./enumerate.yml
types:
# Config
  S3ExternalConfig:
    properties:
      url: optional<string>
      regions: optional<list<string>>
      targetSeed: optional<string>      # Seed (org/domain name) used to generate candidate bucket names to probe
      maxCandidates: optional<integer>  # Max candidate names to probe when targetSeed is set (default 50, cap 500)
# Supporting structs
  DirectoryContents:
    properties:
      key: string
      lastModified: optional<datetime>
      size: optional<integer>
      ownerID: optional<string>
      ownerName: optional<string>
# High level Bucket structs
  ExternalBucketIdentificationInfo:
    properties:
      name: string
      arn: string
      url: string
      region: string
  ExternalBucketConfigurationInfo:
    properties:
      # Result of the anonymous listing probe; unset when inconclusive.
      allowDirectoryListing: optional<boolean>
      # True when a sampled object is anonymously readable; unset otherwise.
      # A failed or unperformed sample does not establish bucket-wide privacy.
      allowAnonymousRead: optional<boolean>
      policy: optional<string>
      acls: optional<list<enumerate.S3BucketAccessControl>>
      ownerID: optional<string>
      ownerName: optional<string>
  ExternalBucketResourceInfo:
    properties:
      directoryContents: optional<list<DirectoryContents>>
# Main External S3 Bucket Structs
  ExternalBucket:
    properties:
      identification: ExternalBucketIdentificationInfo
      configuration: ExternalBucketConfigurationInfo
      resources: optional<ExternalBucketResourceInfo>
  ExternalS3BucketResult:
    properties:
      externalBuckets: optional<list<ExternalBucket>>
  # Report
  ExternalS3Report:
    properties:
      result: ExternalS3BucketResult
      config: S3ExternalConfig
      errors: optional<list<string>>
