imports:
  common: ../common/resources.yml

types:
# Config
  S3EnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  BucketVersioningStatus:
    enum:
      - ENABLED
      - SUSPENDED
  S3MFADeleteStatus:
    enum:
      - ENABLED
      - DISABLED
# Supporting Types
  S3PublicAccessBlockConfiguration:
    properties:
      blockPublicAcls: optional<boolean>
      ignorePublicAcls: optional<boolean>
      blockPublicPolicy: optional<boolean>
      restrictPublicBuckets: optional<boolean>
  S3PublicAccessBlock:
    properties:
      bucket: optional<S3PublicAccessBlockConfiguration>
      effectiveAccount: optional<S3PublicAccessBlockConfiguration>
      effective: optional<S3PublicAccessBlockConfiguration>
  S3BucketAccessControl:
    properties:
      # Public Access Permissions (from ACL and Policy analysis)
      allowPublicRead: optional<boolean>
      allowPublicWrite: optional<boolean>
      allowPublicReadAcp: optional<boolean>
      allowPublicWriteAcp: optional<boolean>
      allowPublicFullControl: optional<boolean>
      # Authenticated Users Permissions  
      allowAuthenticatedUsersRead: optional<boolean>
      allowAuthenticatedUsersWrite: optional<boolean>
      allowAuthenticatedUsersReadAcp: optional<boolean>
      allowAuthenticatedUsersWriteAcp: optional<boolean>
      allowAuthenticatedUsersFullControl: optional<boolean>
      # Log Delivery Permissions
      allowLogDeliveryWrite: optional<boolean>
      allowLogDeliveryReadAcp: optional<boolean>
      # Public Access Block Configuration by source and after effective merging
      publicAccessBlock: optional<S3PublicAccessBlock>
      # Effective Public Access Block values retained for compatibility
      blockPublicAcls: optional<boolean>
      ignorePublicAcls: optional<boolean>
      blockPublicPolicy: optional<boolean>
      restrictPublicBuckets: optional<boolean>
  S3ServerSideEncryption:
    enum:
      - name: "AES256"
        value: "AES256"
      - name: "awskms"
        value: "aws:kms"
      - name: "awskmsdsse"
        value: "aws:kms:dsse"
  EncryptionRule:
    properties:
      sseAlgorithm: optional<S3ServerSideEncryption>
      kmsKey: optional<common.KmsKeyReference>
  S3PolicyRoleReference:
    properties:
      arn: string
      roleName: optional<string>
  S3IamRolePolicyStatement:
    properties:
      statement: string
      principalRoles: optional<list<S3PolicyRoleReference>>
      notPrincipalRoles: optional<list<S3PolicyRoleReference>>
      conditionRoles: optional<list<S3PolicyRoleReference>>
  S3NotificationFilterRule:
    properties:
      name: string
      value: string
  S3LambdaNotification:
    properties:
      id: optional<string>
      function: common.LambdaReference
      events: list<string>
      filterRules: optional<list<S3NotificationFilterRule>>
# S3 High level structs
  S3BucketIdentificationInfo:
    properties:
      name: string
      arn: string
      url: string
      region: string
  S3BucketConfigurationInfo:
    properties:
      creationDate: optional<datetime>
      ownerID: optional<string>
      ownerName: optional<string>
      policy: optional<string>
      bucketVersioning: optional<BucketVersioningStatus>
      mfaDelete: optional<S3MFADeleteStatus>
      encryptionRules: optional<list<EncryptionRule>>
      accessControl: optional<S3BucketAccessControl>
  S3BucketResourceInfo:
    properties:
      iamRolePolicyStatements: optional<list<S3IamRolePolicyStatement>>
      lambdaNotifications: optional<list<S3LambdaNotification>>
# Main S3 Bucket Structs
  S3Bucket:
    properties:
      identification: S3BucketIdentificationInfo
      configuration: S3BucketConfigurationInfo
      resources: optional<S3BucketResourceInfo>
  S3EnumerateResult:
    properties:
      s3Buckets: optional<list<S3Bucket>>
# Report
  S3EnumerateReport:
    properties:
      result: S3EnumerateResult
      config: S3EnumerateConfig
      errors: optional<list<string>>
