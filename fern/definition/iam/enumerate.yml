types:
# Config
  IamEnumerateConfig:
    properties:
      accountId: string
      excludeAWSManagedRoles: boolean
# Supporting Structs
  RoleLastUsed:
    properties:
      lastUsedDate: optional<datetime>
      region: optional<string>
# Attached Policy Supporting Structs
  AttachedPolicyIdentificationInfo:
    properties:
      assignmentId: string
      arn: string
      policyName: string
  AttachedPolicyConfigurationInfo:
    properties:
      policyDocument: optional<string>
  AttachedPolicy:
    properties:
      identification: AttachedPolicyIdentificationInfo
      configuration: optional<AttachedPolicyConfigurationInfo>
# IAM Role High level structs
  IamRoleIdentificationInfo:
    properties:
      arn: string
      roleName: string
  IamRoleConfigurationInfo:
    properties:
      createDate: optional<datetime>
      roleLastUsed: optional<RoleLastUsed>
# IAM Role Resource Info Supporting Structs
  IamRoleResourceInfo:
    properties:
      attachedPolicies: optional<list<AttachedPolicy>>
# Main IAM Role Structs
  IamRoles:
    properties:
      identification: IamRoleIdentificationInfo
      configuration: IamRoleConfigurationInfo
      resources: optional<IamRoleResourceInfo>
  IamEnumerateResult:
    properties:
      resources: optional<list<IamRoles>>
# Report struct
  IamEnumerateReport:
    properties:
      config: IamEnumerateConfig
      result: IamEnumerateResult
      errors: optional<list<string>>
