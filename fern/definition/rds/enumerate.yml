imports:
  common: ../common/resources.yml

types:
# Config
  RdsEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Supporting Types
  Endpoint:
    properties:
      address: string
      port: integer
      hostedZoneId: optional<string>
  StorageConfig:
    properties:
      allocatedStorage: optional<integer>
      maxAllocatedStorage: optional<integer>
      storageType: optional<string>
      storageEncrypted: optional<boolean>
      storageThroughput: optional<integer>
      iops: optional<integer>
  SecurityConfig:
    properties:
      deletionProtection: optional<boolean>
      iamDatabaseAuthenticationEnabled: optional<boolean>
      kmsKeyId: optional<string>
  MonitoringConfig:
    properties:
      monitoringInterval: optional<integer>
      monitoringRoleArn: optional<string>
      performanceInsightsEnabled: optional<boolean>
      performanceInsightsKMSKeyId: optional<string>
  BackupConfig:
    properties:
      backupRetentionPeriod: optional<integer>
      preferredBackupWindow: optional<string>
      preferredMaintenanceWindow: optional<string>
      copyTagsToSnapshot: optional<boolean>
      latestRestorableTime: optional<datetime>
  RdsIamRoleAssociation:
    properties:
      arn: string
      roleName: optional<string>
      featureName: optional<string>
      # Reported association state, not proof of effective permissions.
      status: optional<string>
  RdsVpcReference:
    properties:
      arn: string
      id: string
      region: string
      # Reported by EC2; may differ from the database's account in a shared VPC.
      ownerId: string
  RdsSubnetReference:
    properties:
      arn: string
      id: string
      region: string
      ownerId: string
  RdsSecurityGroupReference:
    properties:
      arn: string
      id: string
      region: string
      ownerId: string
      name: optional<string>
# VPC High level structs
  VpcInstance:
    properties:
      id: string 
      subnetIds: optional<list<string>>
# RDS High level structs
  RdsIdentificationInfo:
    properties:
      arn: string
      # DBInstanceIdentifier, scoped by the enclosing ARN's account and region.
      id: string
      name: optional<string>
      region: string
  RdsConfigurationInfo:
    properties:
      status: optional<string>
      class: optional<string>
      # Database Configuration
      engine: optional<string>
      engineVersion: optional<string>
      # Initial DBName reported by AWS, not the instance name or a database inventory.
      databaseName: optional<string>
      masterUsername: optional<string>
      # Network & Availability
      endpoint: optional<Endpoint>
      # Configured DB subnet-group members, not the instance's active subnet attachments.
      dbSubnetGroupSubnetIds: optional<list<string>>
      availabilityZone: optional<string>
      multiAZ: optional<boolean>
      publiclyAccessible: optional<boolean>
      storage: optional<StorageConfig>
      security: optional<SecurityConfig>
      monitoring: optional<MonitoringConfig>
      backup: optional<BackupConfig>
      # Metadata
      instanceCreateTime: optional<datetime>
      tags: optional<list<common.Tag>>
  RdsResourceInfo:
    properties:
      vpc: optional<RdsVpcReference>
      securityGroups: optional<list<RdsSecurityGroupReference>>
      # Configured subnet-group members, not active instance attachments.
      dbSubnetGroupSubnets: optional<list<RdsSubnetReference>>
      iamRoles: optional<list<RdsIamRoleAssociation>>
      kmsKeys: optional<list<common.KmsKeyReference>>
# Main RDS Structs
  RdsInstance:
    properties:
      identification: RdsIdentificationInfo
      configuration: RdsConfigurationInfo
      resources: optional<RdsResourceInfo>
  RdsEnumerateResult:
    properties:
      rdsInstances: optional<list<RdsInstance>>
# Report Struct
  RdsEnumerateReport:
    properties:
      result: RdsEnumerateResult
      config: RdsEnumerateConfig
      errors: optional<list<string>>
