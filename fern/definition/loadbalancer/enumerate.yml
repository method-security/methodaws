# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  common: ../common/resources.yml

types:
# Config
  LoadBalancerEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
      versions: optional<list<LoadBalancerVersion>>
# Enums
  LoadBalancerVersion:
    enum:
      - V1
      - V2
  LoadBalancerType:
    enum:
      - APPLICATION
      - NETWORK
      - GATEWAY
      - CLASSIC
  LoadBalancerState:
    enum:
      - ACTIVE
      - PROVISIONING
      - ACTIVE_IMPAIRED
      - FAILED
  IpAddressType:
    enum:
      - IPV4
      - DUALSTACK
      - DUALSTACK_WITHOUT_PUBLIC_IPV4
  Protocol:
    enum:
      - HTTP
      - HTTPS
      - TCP
      - TLS
      - UDP
      - TCP_UDP
      - GENEVE
  TargetGroupIpAddressType:
    enum:
      - IPV4
      - IPV6
  TargetType:
    enum:
      - INSTANCE
      - IP
      - LAMBDA
      - ALB
# Supporting Types
  Certificate:
    properties:
      arn: string
      isDefault: boolean
  Listener:
    properties:
      arn: optional<string>
      protocol: optional<Protocol>
      port: optional<integer>
      certificates: optional<list<Certificate>>
  Target:
    properties:
      id: string
      type: optional<TargetType>
      port: optional<integer>
      availabilityZone: optional<string>
# TargetGroup High level structs
  TargetGroupIdentificationInfo:
    properties:
      arn: string
      name: optional<string>
      region: string
  TargetGroupConfigurationInfo:
    properties:
      ipAddressType: optional<TargetGroupIpAddressType>
      port: optional<integer>
      protocol: optional<Protocol>
  TargetGroupResourceInfo:
    properties:
      targets: optional<list<Target>>
# TargetGroup Main Structs
  TargetGroupInstance:
    properties:
      identification: TargetGroupIdentificationInfo
      configuration: TargetGroupConfigurationInfo
      resources: optional<TargetGroupResourceInfo>
# VPC High level structs
# LoadBalancer High level structs
  LoadBalancerIdentificationInfo:
    properties:
      arn: optional<string>
      name: optional<string>
      region: string
  LoadBalancerConfigurationInfo:
    properties:
      loadBalancerType: LoadBalancerType
      dnsName: optional<string>
      createdTime: optional<datetime>
      hostedZoneId: optional<string>
      state: optional<LoadBalancerState>
      ipAddressType: optional<IpAddressType>
  LoadBalancerResourceInfo:
    properties:
      listeners: optional<list<Listener>>
      targets: optional<list<Target>> # ELB v1 only
      targetGroups: optional<list<TargetGroupInstance>> # Targets linked through group in ELB V2
      vpc: optional<common.VpcReference>
      securityGroups: optional<list<common.SecurityGroupReference>>
# Main LoadBalancer structs
  LoadBalancerInstance:
    properties:
      identification: LoadBalancerIdentificationInfo
      configuration: LoadBalancerConfigurationInfo
      resources: optional<LoadBalancerResourceInfo>
  LoadBalancerEnumerateResult:
    properties:
      loadBalancers: optional<list<LoadBalancerInstance>>
# Report Struct
  LoadBalancerEnumerateReport:
    properties:
      result: LoadBalancerEnumerateResult
      config: LoadBalancerEnumerateConfig
      errors: optional<list<string>>
