imports:
  common: ../common/resources.yml
types:
# Config
  CloudFrontEnumerateConfig:
    properties:
      accountId: string
# Enums
  CloudFrontDistributionStatus:
    enum:
      - ENABLED
      - DISABLED
  CloudFrontResourceType:
    enum:
      - S3
      - EC2
      - APPLICATION_LOAD_BALANCER
      - NETWORK_LOAD_BALANCER
      - LOAD_BALANCER
      - VPC_ORIGIN
      - API_GATEWAY
      - UNKNOWN
# Optional backend links; each variant requires its actual resource identity.
  S3OriginBackend:
    properties:
      bucketName: string
  Ec2OriginBackend:
    properties:
      arn: string
  ApiGatewayOriginBackend:
    properties:
      id: string
      region: string
  CloudFrontOriginBackend:
    union:
      s3: S3OriginBackend
      ec2: Ec2OriginBackend
      load_balancer: common.LoadBalancerReference
      api_gateway: ApiGatewayOriginBackend
# Origin High level Structs
  CloudFrontDistributionOriginIdentificationInfo:
    properties:
      # Native origin ID, scoped to the containing distribution ARN, not a backend ID.
      id: string
      domainName: optional<string>
  CloudFrontDistributionOriginConfigurationInfo:
    properties:
      resourceType: CloudFrontResourceType
      path: optional<string>
      customHeaders: optional<list<string>>
      connectionAttempts: optional<integer>
      connectionTimeout: optional<integer>
# Origin Main Struct
  CloudFrontDistributionOrigin:
    properties:
      identification: CloudFrontDistributionOriginIdentificationInfo
      configuration: CloudFrontDistributionOriginConfigurationInfo
      backend: optional<CloudFrontOriginBackend>
# CloudFront Distribution High level Structs
  CloudFrontDistributionIdentificationInfo:
    properties:
      arn: string
      id: optional<string>
      domainName: optional<string>
  CloudFrontDistributionConfigurationInfo:
    properties:
      status: CloudFrontDistributionStatus
      comment: optional<string>
  CloudFrontDistributionResourceInfo:
    properties:
      origins: optional<list<CloudFrontDistributionOrigin>>
# Main CloudFront Distribution Structs
  CloudFrontDistribution:
    properties:
      identification: CloudFrontDistributionIdentificationInfo
      configuration: CloudFrontDistributionConfigurationInfo
      resources: optional<CloudFrontDistributionResourceInfo>
  CloudFrontEnumerateResult:
    properties:
      distributions: optional<list<CloudFrontDistribution>>
  # Report Struct
  CloudFrontEnumerateReport:
    properties:
      result: CloudFrontEnumerateResult
      config: CloudFrontEnumerateConfig
      errors: optional<list<string>>
