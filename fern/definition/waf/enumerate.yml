imports:
  common: ../common/resources.yml

types:
# Config
  WafEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# WAF Enums
  ActionType:
    enum:
      - ALLOW
      - BLOCK
      - CAPTCHA
      - CHALLENGE
      - COUNT
  OverrideActionType:
    enum:
      - NONE
      - COUNT
  ScopeType:
    enum:
      - REGIONAL
      - CLOUDFRONT
  StatementType:
    enum:
      - AND
      - BYTE_MATCH
      - GEO_MATCH
      - IP_SET_REFERENCE
      - LABEL_MATCH
      - MANAGED_RULE_GROUP
      - NOT
      - OR
      - RATE_BASED
      - REGEX_MATCH
      - REGEX_PATTERNSET_REFENCE
      - RULE_GROUP_REFERENCE
      - SIZE_CONSTRAINT
      - SQLI_MATCH
      - XSS_MATCH
      - OTHER
# Rule Supporting Structs
  ActionInfo:
    properties:
      type: ActionType
      jsonString: optional<string>
  StatementInfo:
    properties:
      type: StatementType
      rawStatement: optional<string>
# Main Rule Structs
  RuleIdentificationInfo:
    properties:
      # Parent Web ACL ARN plus /rule/<name>; a scoped ID, not an AWS-issued rule ARN.
      id: string
      name: string
  RuleConfigurationInfo:
    properties:
      priority: integer
      statement: StatementInfo
      action: optional<ActionInfo>
      overrideAction: optional<OverrideActionType>
      labels: optional<list<string>>
      rawRule: string
  RuleInfo:
    properties:
      identification: RuleIdentificationInfo
      configuration: RuleConfigurationInfo
# High level structs
  WafIdentificationInfo:
    properties:
      arn: string
      name: optional<string>
      region: string
  WafConfigurationInfo:
    properties:
      scope: ScopeType
      description: optional<string>
      defaultAction: optional<ActionType>
      apiGatewayStageAssociations: optional<list<ApiGatewayStageAssociation>>
  ApiGatewayStageAssociation:
    properties:
      stageArn: string
      stageName: string
      api: common.ApiGatewayReference
  WafResourceInfo:
    properties:
      loadBalancers: optional<list<common.LoadBalancerReference>>
      cloudFrontDistributions: optional<list<common.CloudFrontDistributionReference>>
      rules: optional<list<RuleInfo>>
# Main WAF structs
  WafInstance:
    properties:
      identification: WafIdentificationInfo
      configuration: WafConfigurationInfo
      resources: optional<WafResourceInfo>
  WafEnumerateResult:
    properties:
      wafs: optional<list<WafInstance>>
# Report Struct
  WafEnumerateReport:
    properties:
      result: WafEnumerateResult
      config: WafEnumerateConfig
      errors: optional<list<string>>
