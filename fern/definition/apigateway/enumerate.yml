imports:
  common: ../common/resources.yml
types:
# Config
  ApiGatewayEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
      versions: optional<list<ApiGatewayVersion>>
# Enums
  ApiGatewayVersion:
    enum:
      - V1
      - V2
  AuthorizationType:
    enum:
      - NONE
      - AWS_IAM
      - CUSTOM
      - COGNITO_USER_POOLS
      - JWT
  SecurityPolicy:
    enum:
      - TLS_1_0
      - TLS_1_2
# References
  LambdaReference:
    properties:
      arn: string
      functionName: optional<string>
      region: string
  EndpointType:
    enum:
      - EDGE
      - REGIONAL
      - PRIVATE
  Authorizer:
    properties:
      id: string
      name: optional<string>
      type: optional<string>
# Supporting Types
  Certificate:
    properties:
      arn: string
      domainName: optional<string>
      securityPolicy: optional<SecurityPolicy>
  AccessLogSettings:
    properties:
      destinationArn: string
      format: optional<string>
  CorsConfiguration:
    properties:
      allowCredentials: optional<boolean>
      allowHeaders: optional<list<string>>
      allowMethods: optional<list<string>>
      allowOrigins: optional<list<string>>
      exposeHeaders: optional<list<string>>
      maxAge: optional<integer>
  ApiGatewaySecurity:
    properties:
      hasWafIntegration: optional<boolean>
      hasThrottling: optional<boolean>
      openEndpoints: optional<integer>
      authenticationMethods: optional<list<AuthorizationType>>
      tlsVersions: optional<list<SecurityPolicy>>
      corsConfigured: optional<boolean>
      apiKeysRequired: optional<boolean>
  Throttle:
    properties:
      rateLimit: optional<double>
      burstLimit: optional<integer>
# Backend Types - what integrations connect to
  LambdaBackend:
    properties:
      arn: string
      functionName: optional<string>
      region: string
  LoadBalancerBackend:
    properties:
      uri: string
      vpcLinkId: string
      loadBalancerArn: optional<string>
      loadBalancerArns: optional<list<string>>
      listenerArn: optional<string>
      dnsName: optional<string>
  ServiceDiscoveryBackend:
    properties:
      uri: string
      vpcLinkId: string
      serviceArn: string
  HttpBackend:
    properties:
      uri: string
      isExternal: boolean
  AwsServiceBackend:
    properties:
      # Integration operation URI, not the ARN of a target resource.
      uri: string
      service: string
      region: string
  MockBackend:
    properties:
      statusCode: optional<string>
# Integrations - explicit links between routes and backends  
  AwsProxyIntegration:
    properties:
      backend: LambdaBackend
  VpcLinkIntegration:
    properties:
      backend: VpcLinkBackend
  VpcLinkBackend:
    union:
      load_balancer: LoadBalancerBackend
      service_discovery: ServiceDiscoveryBackend
  HttpIntegration:
    properties:
      backend: HttpBackend
  HttpProxyIntegration:
    properties:
      backend: HttpBackend
  AwsIntegration:
    properties:
      backend: AwsServiceBackend
  MockIntegration:
    properties:
      backend: MockBackend
  Integration:
    union:
      aws_proxy: AwsProxyIntegration
      vpc_link: VpcLinkIntegration
      http: HttpIntegration
      http_proxy: HttpProxyIntegration
      aws: AwsIntegration
      mock: MockIntegration
# Route Structure
  RouteIdentificationInfo:
    properties:
      path: string
      method: string
  RouteConfigurationInfo:
    properties:
      authorization: optional<AuthorizationType>
      apiKeyRequired: optional<boolean>
      isDefaultRoute: optional<boolean>
      throttle: optional<Throttle>
  RouteResourceInfo:
    properties:
      integration: optional<Integration>
      executionRole: optional<common.IamRoleReference>
      cloudWatchLog: optional<common.CloudWatchLogReference>
  Route:
    properties:
      identification: RouteIdentificationInfo
      configuration: RouteConfigurationInfo
      resources: optional<RouteResourceInfo>
# Stage Structure
  StageIdentificationInfo:
    properties:
      arn: string
      name: string
      region: string
  StageConfigurationInfo:
    properties:
      description: optional<string>
      deploymentId: optional<string>
      variables: optional<map<string, string>>
      autoDeploy: optional<boolean>
      accessLogSettings: optional<AccessLogSettings>
      clientCertificateId: optional<string>
  StageResourceInfo:
    properties:
      webAcl: optional<common.WebAclReference>
  Stage:
    properties:
      identification: StageIdentificationInfo
      configuration: StageConfigurationInfo
      resources: optional<StageResourceInfo>
# API Gateway Structure
  ApiGatewayIdentificationInfo:
    properties:
      arn: string
      id: string
      name: optional<string>
      region: string
      url: optional<string>
  ApiGatewayConfigurationInfo:
    properties:
      version: ApiGatewayVersion
      description: optional<string>
      corsConfiguration: optional<CorsConfiguration>
      certificates: optional<list<Certificate>>
      security: optional<ApiGatewaySecurity>
  ApiGatewayResourceInfo:
    properties:
      stages: optional<list<Stage>>
      # Current API configuration, not a stage's deployed snapshot.
      routes: optional<list<Route>>
  ApiGatewayInstance:
    properties:
      identification: ApiGatewayIdentificationInfo
      configuration: ApiGatewayConfigurationInfo
      resources: optional<ApiGatewayResourceInfo>
# Results
  ApiGatewayEnumerateResult:
    properties:
      apis: optional<list<ApiGatewayInstance>>
  ApiGatewayEnumerateReport:
    properties:
      result: ApiGatewayEnumerateResult
      config: ApiGatewayEnumerateConfig
      errors: optional<list<string>>
