# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  common: ../common/resources.yml

types:
# Config
  SecurityGroupsEnumerateConfig:
    properties:
      accountId: string
      regions: list<string>
# Enums
  SecurityGroupType:
    enum:
      - EC2
      - RDS
  PermissionDirection:
    enum:
      - INGRESS
      - EGRESS
# RuleSupporting Structs
  ReferencedSecurityGroup:
    properties:
      groupId: string
      userId: optional<string>
  RulePeerInfo:
    properties:
      cidrs: optional<list<string>>
      referencedSecurityGroup: optional<ReferencedSecurityGroup>
      prefixListId: optional<string>
# Main Rule Structs
  RuleIdentificationInfo:
    properties:
      id: string
  RuleConfigurationInfo:
    properties:
      direction: PermissionDirection
      peer: RulePeerInfo
      fromPort: optional<integer>
      toPort: optional<integer>
      ipProtocol: optional<string>
      description: optional<string>
  RuleResourceInfo:
    properties:
      peer: RulePeerInfo
  RuleDetails:
    properties:
      identification: RuleIdentificationInfo
      configuration: RuleConfigurationInfo
      resources: optional<RuleResourceInfo>
# Security Group High level structs
  SecurityGroupIdentificationInfo:
    properties:
      id: string
      arn: optional<string>
      name: optional<string>
      region: string
  SecurityGroupConfigurationInfo:
    properties:
      description: optional<string>
      securityGroupType: SecurityGroupType
      ownerId: optional<string>
      tags: optional<list<common.Tag>>
  SecurityGroupResourceInfo:
    properties:
      vpc: optional<common.VpcReference>
      rules: optional<list<RuleDetails>>
      ec2Instances: optional<list<common.Ec2InstanceReference>>
      rdsInstances: optional<list<common.RdsInstanceReference>>
      loadBalancers: optional<list<common.LoadBalancerReference>>
# Main Security Group Structs
  SecurityGroup:
    properties:
      identification: SecurityGroupIdentificationInfo
      configuration: SecurityGroupConfigurationInfo
      resources: optional<SecurityGroupResourceInfo>
  SecurityGroupsEnumerateResult:
    properties:
      securityGroups: optional<list<SecurityGroup>>
# Report Struct
  SecurityGroupsEnumerateReport:
    properties:
      result: SecurityGroupsEnumerateResult
      config: SecurityGroupsEnumerateConfig
      errors: optional<list<string>>
